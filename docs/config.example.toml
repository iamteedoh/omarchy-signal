# omarchy-signal configuration, edited by `omarchy-signal settings` and the client's settings screen.
# Live keys apply immediately; keys marked (restart) need: systemctl --user restart omarchy-signal

account = ""   # E.164 of the account to use; empty = first linked (restart)
signal_cli = "signal-cli"   # (restart)
log_level = "info"   # debug | info | warning | error (restart)

# ── Notifications ──
notifications = "popup"   # popup: click-to-reply toast · system: plain Omarchy notification · off
notification_content = "name-and-message"   # What a popup reveals: sender and text, sender only, or neither
notification_timeout_ms = 8000   # How long a popup stays on screen
respect_dnd = true   # No popups while Omarchy's Do Not Disturb is on (unread counts still update)
notification_sound = ""   # A .wav/.ogg/.oga file played with each popup (pw-play); empty for silence
# ── Privacy ──
send_read_receipts = true   # Tell senders you read their messages; the same receipt clears the notification on your phone
typing_indicators = true   # Send and show typing indicators
trust_new_identities = "on-first-use"   # on-first-use matches Signal's clients; never refuses changed safety numbers (restart)
# ── Chats & media ──
inline_images = "always"   # always: as they arrive · click: only after you click · never
download_attachments = true   # Fetch attachments as messages arrive (restart)
attachment_thumbnails = true   # Picture tiles in the attachment picker; off shows a plain file list
save_dir = "~/Downloads"   # Folder used by the attachment menu's save action
emoji_autoconvert = true   # As you type (after the space) and on send; off sends them exactly as written
message_layout = "left"   # left: everything left-aligned · bubbles: yours on the right
# ── Appearance ──
scroll_speed = 9   # Multiplier for trackpad and mouse-wheel scrolling in the popup and chat window; 0 = Qt's default
terminal = "auto"   # auto follows omarchy default terminal; images need ghostty, kitty or wezterm
terminal_images = "auto"   # auto probes the terminal
image_max_rows = 14
qr_style = "auto"   # auto: shell popup, else image, else text
# ── Data ──
history_enabled = true   # Store messages on disk (owner-only SQLite); off = nothing survives a restart (restart)
history_retain_days = 0   # 0 keeps everything
device_name = "omarchy-signal"   # Shown in Signal's Linked devices (restart)
